packages:
  - docs-site
  - emitters/*
  - spec/draft
  - spec/scripts
  - sdk/typescript

# Versions shared by the private workspace packages, referenced as "catalog:".
# sdk/typescript keeps its own: npm pack and npm publish do not resolve catalogs.
catalog:
  "@alloy-js/babel-preset": 0.4.0
  "@alloy-js/core": 0.26.0
  "@alloy-js/csharp": 0.26.0
  "@astrojs/markdown-remark": 7.3.10
  "@astrojs/starlight": 0.43.1
  "@babel/cli": ^8.1.0
  "@babel/core": ^8.1.3
  "@babel/preset-typescript": ^8.0.7
  "@types/node": ^26.6.6
  "@typespec/compiler": 1.18.0
  "@typespec/emitter-framework": 0.22.0
  "@typespec/json-schema": 1.18.0
  ajv: 8.20.0
  ajv-cli: 5.0.0
  ajv-formats: 3.0.1
  astro: 7.4.13
  astro-mermaid: 2.2.0
  astro-rehype-relative-markdown-links: 0.19.2
  mermaid: 12.3.0
  rimraf: 6.1.4
  tsx: 4.23.15
  typescript: 7.0.2

overrides:
  minimatch: ^11.0.9
  glob: ^14.0.6

allowBuilds:
  esbuild: true
