# Ruff settings for the Python files outside sdk/python: scripts/ and
# conformance/. The SDK keeps its own settings in sdk/python/pyproject.toml.
# CPY001 (the file header rule) is a preview rule, so preview is on for
# lint only and explicit-preview-rules keeps every other preview rule off.
# select names ruff's standard default set (E4, E7, E9, F) outright,
# because preview mode would otherwise swap in a much larger default set.
# (?m) lets the header follow a shebang line.

[lint]
preview = true
explicit-preview-rules = true
select = ["E4", "E7", "E9", "F", "CPY001"]

[lint.flake8-copyright]
notice-rgx = "(?m)^# Copyright \\(c\\) Microsoft\\. All rights reserved\\."
