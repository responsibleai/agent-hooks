# Every output generated from the draft TypeSpec source (`pnpm generate`).
# Each emitter-output-dir holds only that emitter's generated files.
emit:
  - "@typespec/json-schema"
options:
  "@typespec/json-schema":
    emitter-output-dir: "{project-root}/schema/generated"
    file-type: json
