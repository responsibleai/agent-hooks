[package]
name = "agent-hooks-node"
version = "0.1.0-alpha.3"
edition = "2021"
license = "MIT"
description = "napi-rs bindings for the agent-hooks Rust core."
publish = false

[lib]
path = "native/lib.rs"
crate-type = ["cdylib"]

[dependencies]
agent-hooks-sdk = { path = "../rust/core" }
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
