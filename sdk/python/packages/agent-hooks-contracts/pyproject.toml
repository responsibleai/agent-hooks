[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-hooks-contracts"
version = "0.1.0b4"
description = "Generated Python wire contracts for Agent Hooks, without native dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["typing-extensions>=4.16.0"]

[project.optional-dependencies]
dev = ["hatchling>=1.27,<2", "mypy>=2.2.0", "pytest>=9.1.1", "ruff>=0.15.21"]

[project.urls]
Repository = "https://github.com/responsibleai/agent-hooks"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_hooks_contract"]

[tool.mypy]
strict = true
warn_unreachable = true
