[build-system]
requires = ["maturin>=1.14.1,<2.0"]
build-backend = "maturin"

[project]
# Distribution name: "agent-hooks" is squatted on PyPI and the
# similarity check blocks all separator variants (incl. agenthooks).
# Import name stays agent_hooks.
name = "agent-hooks-sdk"
version = "0.1.0a5"
description = "Framework-neutral agent control contract: interception points, agent context, verdict, and conformance test kit. Python wrapper over the canonical Rust core. Cooperative contract, not a security boundary: the host is fully trusted (see SECURITY.md)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Responsible AI", email = "responsibleai@microsoft.com" }]
keywords = ["ai-agents", "governance", "interception", "control", "conformance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
ctk = ["jsonschema>=4.26.0", "pytest>=9.1.1"]
dev = ["agent-hooks-sdk[ctk]", "mypy>=2.2.0", "ruff>=0.15.21", "maturin>=1.14.1,<2.0"]

[project.urls]
Homepage = "https://github.com/responsibleai/agent-hooks"
Specification = "https://github.com/responsibleai/agent-hooks/blob/main/spec/AGENT-HOOKS-0.1.md"

[project.entry-points.pytest11]
agent_hooks_ctk = "agent_hooks.ctk.plugin"

[tool.maturin]
# Supply chain: refuse to build if Cargo.lock is out of date.
locked = true
python-source = "python"
module-name = "agent_hooks._core"
features = ["pyo3/extension-module"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF", "BLE"]
ignore = [
  "RUF002",  # en-dash in docstrings is intentional (spec section ranges)
]

[tool.mypy]
strict = true
warn_unreachable = true
