[workspace]
resolver = "2"
members = ["core", "ffi"]

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/responsibleai/agent-hooks"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
thiserror = "2"
async-trait = "0.1"
