[package]
# Distribution name: "agent-hooks" is taken on crates.io by an
# unrelated project; "agent-hooks-sdk" matches the PyPI distribution.
# The lib name stays agent_hooks so `use agent_hooks` is unchanged.
name = "agent-hooks-sdk"
description = "Framework-neutral agent control contract (AGENT-HOOKS-0.1). Canonical Rust core; other SDKs bind to this crate. Cooperative contract, not a security boundary: the host is fully trusted (see SECURITY.md)."
keywords = ["ai-agents", "governance", "interception", "control"]
categories = ["api-bindings"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "agent_hooks"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
ryu-js = { version = "1.0", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["time"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
proptest = "1"

[features]
default = []
ctk = []
# §7 timeout wrappers for Rust-native hosts (TimeoutInterceptor /
# TimeoutResolver); gated because the core is otherwise runtime-agnostic.
tokio-timeout = ["dep:tokio"]
