# cargo-deny configuration (LATER-08) — applies to all three cargo
# roots (sdk/rust workspace, sdk/python, sdk/typescript), which resolve
# this file from the repository root.
#
# The RFC 8785 canonicalization serializer is vendored into the core
# (sdk/rust/core/src/jcs.rs, see THIRD-PARTY-NOTICES.md); its one
# retained dependency, ryu-js (ECMA-262 Number::toString formatting,
# identity-critical), is covered by the advisory and license gates
# below like every other node in the graph.

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "ISC",
  "BSL-1.0",
  "Unicode-3.0",
  "Unlicense",
]

[bans]
multiple-versions = "warn"
# Intra-repo path dependencies carry no version by design.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
