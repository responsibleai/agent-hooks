name: schema-drift

# No path filter on pull_request: `drift` is a required check, and a
# path-filtered required check deadlocks every PR that doesn't match the
# filter (GitHub never creates the check run, so the branch protection
# waits forever). The job is cheap; run it on every PR.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Regenerate per-point schemas and vendored copies
        run: |
          python3 scripts/gen-per-point-schemas.py
          rm -rf sdk/python/python/agent_hooks/schema
          mkdir -p sdk/python/python/agent_hooks/schema/agent-context
          cp spec/schema/*.json sdk/python/python/agent_hooks/schema/
          cp spec/schema/agent-context/*.json sdk/python/python/agent_hooks/schema/agent-context/
          rm -rf sdk/python/python/agent_hooks/ctk/vectors
          mkdir -p sdk/python/python/agent_hooks/ctk/vectors
          cp conformance/vectors/AH-CTK-*.json sdk/python/python/agent_hooks/ctk/vectors/
      - name: Fail if regeneration produced a diff
        # -A first so untracked regenerated output also fails the gate.
        run: git add -A && git diff --cached --exit-code
