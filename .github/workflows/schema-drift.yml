name: schema-drift

# Checks:
# - spec-draft-generated-schema-check: regenerate the draft JSON Schemas, then fail on drift.
#   Each language emitter checks its own output in its SDK's CI (emitters/README.md).
# - python-released-schema-mirror: refresh released Python schema mirrors, then fail on drift.
# - python-ctk-vector-mirror: refresh the Python CTK vector mirror, then fail on drift.
# - python-draft-schema-mirror: report experimental draft mirror drift as a warning.
# - drift: required aggregate; fails unless every check job succeeds.
#
# No pull_request path filter: the required `drift` check must be created
# on every PR, including those that do not touch schemas.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  spec-draft-generated-schema-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Regenerate draft JSON Schemas
        # The JSON Schema emitter never deletes output, so clear it first:
        # a schema that is no longer produced then shows up as a deletion.
        run: |
          pnpm run clean:schema
          pnpm exec tsp compile spec/draft --emit @typespec/json-schema
      - name: Fail on generated drift
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status
            git --no-pager diff
            echo "::error::generated JSON Schemas differ from their TypeSpec source; run pnpm generate and commit the result"
            exit 1
          fi

  python-released-schema-mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check released Python schema mirrors
        run: python3 sdk/python/scripts/check-released-schema-mirror.py

  python-ctk-vector-mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Python CTK vector mirror
        run: python3 sdk/python/scripts/check-ctk-vector-mirror.py

  python-draft-schema-mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Regenerate draft JSON Schemas for comparison
        run: pnpm exec tsp compile spec/draft --emit @typespec/json-schema
      - name: Report experimental draft mirror drift
        run: python3 sdk/python/scripts/check-draft-schema-mirror.py

  drift:
    if: ${{ always() }}
    needs:
      [
        spec-draft-generated-schema-check,
        python-released-schema-mirror,
        python-ctk-vector-mirror,
        python-draft-schema-mirror,
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require all drift checks to complete successfully
        env:
          SPEC_DRAFT_GENERATED_SCHEMA_CHECK: ${{ needs.spec-draft-generated-schema-check.result }}
          PYTHON_RELEASED_SCHEMA_MIRROR: ${{ needs.python-released-schema-mirror.result }}
          PYTHON_CTK_VECTOR_MIRROR: ${{ needs.python-ctk-vector-mirror.result }}
          PYTHON_DRAFT_SCHEMA_MIRROR: ${{ needs.python-draft-schema-mirror.result }}
        run: |
          if [[ "${SPEC_DRAFT_GENERATED_SCHEMA_CHECK:-}" != success ||
                "${PYTHON_RELEASED_SCHEMA_MIRROR:-}" != success ||
                "${PYTHON_CTK_VECTOR_MIRROR:-}" != success ||
                "${PYTHON_DRAFT_SCHEMA_MIRROR:-}" != success ]]; then
            echo "::error::a drift check failed, was skipped, cancelled, or did not report a result"
            exit 1
          fi
