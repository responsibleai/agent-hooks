name: schema-drift

# No pull_request path filter: `drift` is a required check and must be
# created on every PR, including those that do not touch schemas.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  draft-generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22" }
      - run: npm ci
        working-directory: spec/scripts
      - name: Check generated draft schemas
        run: npm run check:schema
        working-directory: spec/scripts
      - name: Test mirror and aggregate checks
        run: python3 -m unittest discover -s sdk/python/scripts/tests -p test_schema_drift.py

  released-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check released Python schema mirrors
        run: bash sdk/python/scripts/check-released-schema-mirror.sh

  ctk-vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Python CTK vector mirror
        run: bash sdk/python/scripts/check-ctk-vector-mirror.sh

  draft-python-advisory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22" }
      - run: npm ci
        working-directory: spec/scripts
      - name: Regenerate draft schemas for comparison
        run: npm run generate:schema
        working-directory: spec/scripts
      - name: Report experimental draft mirror drift
        run: bash sdk/python/scripts/check-draft-schema-mirror.sh

  drift:
    if: ${{ always() }}
    needs: [draft-generated, released-python, ctk-vectors, draft-python-advisory]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require all drift checks to complete successfully
        env:
          DRAFT_GENERATED: ${{ needs.draft-generated.result }}
          RELEASED_PYTHON: ${{ needs.released-python.result }}
          CTK_VECTORS: ${{ needs.ctk-vectors.result }}
          DRAFT_PYTHON: ${{ needs.draft-python-advisory.result }}
        run: |
          if [[ "${DRAFT_GENERATED:-}" != success ||
                "${RELEASED_PYTHON:-}" != success ||
                "${CTK_VECTORS:-}" != success ||
                "${DRAFT_PYTHON:-}" != success ]]; then
            echo "::error::a drift check failed, was skipped, cancelled, or did not report a result"
            exit 1
          fi
