# Released specification and conformance immutability.
#
# - PRs must not modify a spec/<MAJOR.MINOR>/ or
#   conformance/<MAJOR.MINOR>/ folder that exists on the base branch;
#   edit the draft or add a new version folder. The one exception:
#   a new regular .json file under spec/<version>/schema/examples/<Type>/
#   may be added. Modified or deleted files, and any other new file, fail.
#
# Required-check rule: this workflow has NO paths filter and reports on
# every PR (a path-filtered required check deadlocks the queue — see
# CONTRIBUTING.md).
# Keep the workflow and job names for existing required-check settings.
name: change-class

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  change-class:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve the base revision
        id: base
        # The checkout is refs/pull/<n>/merge, whose first parent is the
        # current tip of the base branch. github.event.pull_request.base.sha
        # is captured when the PR is opened and never refreshed, so a
        # version folder released after that point would be invisible to
        # the released-folder check below. A checkout that is not a merge
        # commit fails here with a clear message rather than later with
        # an unresolved revision.
        run: |
          set -eu
          if ! git rev-parse --verify --quiet HEAD^2 > /dev/null; then
            echo "::error::HEAD is not a merge commit; expected the refs/pull/<n>/merge checkout"
            exit 1
          fi
          sha=$(git rev-parse --verify HEAD^1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Released specification and conformance folders are immutable
        # Run the copy of the guard at the base revision, so a pull
        # request cannot relax the rule it is checked against. The head
        # copy is used only when the base branch has no guard yet.
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          set -eu
          guard="$RUNNER_TEMP/check-released-specs-immutable.py"
          git rev-parse --verify --quiet "$BASE^{commit}" > /dev/null
          if git cat-file -e "$BASE:scripts/check-released-specs-immutable.py" 2>/dev/null; then
            git show "$BASE:scripts/check-released-specs-immutable.py" > "$guard"
          else
            echo "::notice::the base revision has no released-folder guard; running the head copy"
            cp scripts/check-released-specs-immutable.py "$guard"
          fi
          python3 "$guard" "$BASE" HEAD
