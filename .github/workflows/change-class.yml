# Change-class enforcement (GOVERNANCE.md).
#
# - PRs labeled `spec:breaking` must bump a version surface (the spec
#   header or an SDK manifest) in the same PR.
# - PRs that touch the normative surface (spec/, conformance vectors/
#   schema) must carry one of the change-class labels so reviewers and
#   the CHANGELOG see the classification.
# - PRs must not modify a spec/<MAJOR.MINOR.PATCH>/ folder that exists on
#   the base branch; edit spec/draft/ or add a new version folder. The
#   one exception: a new file under <version>/schema/examples/ may be
#   added. Modified or deleted files, and new files elsewhere in the
#   folder, fail.
#
# Required-check rule: this workflow has NO paths filter and reports on
# every PR (a path-filtered required check deadlocks the queue — see
# CONTRIBUTING.md).
name: change-class

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  change-class:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve the base revision
        id: base
        # The checkout is refs/pull/<n>/merge, whose first parent is the
        # current tip of the base branch. github.event.pull_request.base.sha
        # is captured when the PR is opened and never refreshed, so a
        # version folder released after that point would be invisible to
        # the released-folder check below.
        run: echo "sha=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"
      - name: Enforce label/version-bump coupling
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          set -eu
          changed=$(git diff --name-only "$BASE"...HEAD)
          echo "labels: ${LABELS:-<none>}"

          normative=$(echo "$changed" | grep -E \
            '^(spec/|conformance/vectors|conformance/vectors\.schema\.json)' || true)
          if [ -n "$normative" ] && ! echo "$LABELS" | grep -qE 'spec:(breaking|additive)'; then
            echo "::error::PR touches the normative surface but carries no spec:breaking/spec:additive label:"
            echo "$normative"
            exit 1
          fi

          if echo "$LABELS" | grep -q 'spec:breaking'; then
            bump=$(echo "$changed" | grep -E \
              '^(spec/[^/]+/AGENT-HOOKS|sdk/rust/core/Cargo\.toml|sdk/python/pyproject\.toml|sdk/typescript/package\.json|sdk/dotnet/src/AgentHooks/.*\.csproj|CHANGELOG\.md)' || true)
            if [ -z "$bump" ]; then
              echo "::error::spec:breaking PR must change a version surface (spec header, an SDK manifest, or CHANGELOG.md)"
              exit 1
            fi
          fi
          echo "change-class ok"
      - name: Released specification folders are immutable
        # Run the copy of the guard at the base revision, so a pull
        # request cannot relax the rule it is checked against. The head
        # copy is used only when the base branch has no guard yet.
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          set -eu
          guard="$RUNNER_TEMP/check-released-specs-immutable.py"
          if ! git show "$BASE:scripts/check-released-specs-immutable.py" > "$guard" 2>/dev/null; then
            echo "::notice::the base revision has no released-folder guard; running the head copy"
            cp scripts/check-released-specs-immutable.py "$guard"
          fi
          python3 "$guard" "$BASE" HEAD
