name: ci

on:
  push:
    branches: [main]
  pull_request:

# Supply chain: least privilege — jobs only read the repo.
permissions:
  contents: read

# The SDKs support two specification versions, the released 0.1 and the
# draft (VERSIONING.md). Steps that cover every bundle loop over spec/*/;
# the draft is spec/draft, named where a step reads it alone.

jobs:
  schema-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22" }
      - run: npm install -g ajv-cli@5.0.0 ajv-formats@3.0.1
      - name: Validate schemas are well-formed
        run: |
          set -e
          # Validate each specification bundle and its matching conformance
          # schema together, so external references cannot cross versions.
          validated=0
          for spec_dir in spec/*/; do
            [ -d "${spec_dir}schema" ] || continue
            root="${spec_dir}schema/generated"
            [ -d "$root" ] || root="${spec_dir}schema"
            mapfile -t schemas < <(find "$root" -name '*.schema.json' -not -path '*/src/*' | sort)
            if [ "${#schemas[@]}" -eq 0 ]; then
              echo "::error::$root holds no *.schema.json files"
              exit 1
            fi
            version=$(basename "$spec_dir")
            schemas+=("conformance/$version/vectors.schema.json")
            echo "Validating ${#schemas[@]} schemas under $root"
            for f in "${schemas[@]}"; do
              # -r must not include the file under -s (ajv rejects duplicate $id)
              refs=()
              for r in "${schemas[@]}"; do
                [ "$r" = "$f" ] || refs+=(-r "$r")
              done
              ajv compile --spec=draft2020 -c ajv-formats -s "$f" "${refs[@]}"
            done
            validated=$((validated + 1))
          done
          if [ "$validated" -eq 0 ]; then
            echo "::error::no spec/*/schema folder found; nothing validated"
            exit 1
          fi
          echo "schemas validated for $validated bundle(s)"
      - name: Validate each versioned conformance suite
        run: |
          set -e
          validated=0
          for spec_dir in spec/*/; do
            name=$(basename "$spec_dir")
            suite="conformance/$name"
            root="${spec_dir}schema/generated"
            [ -d "$root" ] || root="${spec_dir}schema"
            [ -d "$root" ] || continue
            if [ ! -f "$suite/vectors.schema.json" ] || [ ! -d "$suite/vectors" ]; then
              echo "::error::missing versioned suite at $suite"
              exit 1
            fi
            count=$(find "$suite/vectors" -maxdepth 1 -name 'AH-CTK-*.json' | wc -l)
            if [ "$count" -eq 0 ]; then
              echo "::error::$suite/vectors contains no vectors"
              exit 1
            fi
            mapfile -t refs < <(find "$root" -name '*.schema.json' -not -path '*/src/*' | sort | sed 's/^/-r=/')
            echo "Validating $suite/vectors against $root"
            ajv validate --spec=draft2020 -c ajv-formats \
              -s "$suite/vectors.schema.json" "${refs[@]}" \
              -d "$suite/vectors/*.json"
            validated=$((validated + 1))
          done
          if [ "$validated" -eq 0 ]; then
            echo "::error::no versioned conformance suites were validated"
            exit 1
          fi
          echo "versioned conformance suites validated: $validated"

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with: { toolchain: stable }
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install locked dependencies, then the package itself
        # requirements-dev.lock pins every transitive dep including the
        # maturin build backend (uv pip compile); --no-build-isolation
        # makes the editable install use that pinned maturin instead of
        # fetching a floating one, and [tool.maturin] locked=true pins
        # the Rust side via Cargo.lock.
        run: |
          uv pip install --system -r sdk/python/requirements-dev.lock
          uv pip install --system --no-deps --no-build-isolation -e ./sdk/python
      - run: ruff format --check sdk/python scripts && ruff check sdk/python scripts
      # The required set: the tests marked draft run in draft-tests.
      - run: pytest sdk/python/tests -p no:agent_hooks_ctk -m "not draft" -v

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with: { toolchain: stable }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22" }
      - run: npm ci
        working-directory: sdk/typescript
      - name: Schema examples match their JSON Schemas (every bundle)
        run: node scripts/check-schema-examples.mjs
        working-directory: sdk/typescript
      - name: Compare the latest release schemas with the draft
        # Differential validation (the tool exits 1 when the two sets
        # judge an instance differently) and a structural diff of the
        # newest spec/<MAJOR.MINOR>/ schema set (schema/generated/ when
        # present, else schema/) against the draft, as two runs. The two
        # sets are two specification versions with their own wire
        # strings, so each side reads a `spec` member as its own
        # (--wire-old, --wire-new): the instances that differ by that
        # member alone are reported on their own line, not counted as
        # disagreements or narrowing. This step gates the tool's health
        # only: it fails when no release folder exists, when a run
        # crashes, or when a report lacks its summary lines. The drift
        # verdict itself is the next step's, which may fail without
        # failing the job.
        id: drift
        run: |
          set -u
          version_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          version=$(for dir in ../../spec/*/; do basename "$dir"; done | grep -E "$version_pattern" | sort -V | tail -1)
          if [ -z "$version" ]; then
            echo "::error::no released spec/<MAJOR.MINOR>/ folder to compare with the draft"
            exit 1
          fi
          # The tool reads schema/generated/ when a bundle has it, else schema/.
          old="../../spec/$version/schema"
          new="../../spec/draft/schema/generated"
          wires=(--wire-old "agent-hooks/$version" --wire-new agent-hooks/draft)
          validation="$RUNNER_TEMP/schema-drift-validation.txt"
          structure="$RUNNER_TEMP/schema-drift-structure.txt"
          validation_status=0
          npm run --silent check:schema:equivalence -- --old "$old" --new "$new" "${wires[@]}" \
            > "$validation" 2>&1 || validation_status=$?
          structure_status=0
          npm run --silent check:schema:equivalence -- --old "$old" --new "$new" "${wires[@]}" --structural-diff \
            > "$structure" 2>&1 || structure_status=$?
          cat "$validation" "$structure"
          disagreements=$(sed -nE 's/^total: .* ([0-9]+) disagreements .*$/\1/p' "$validation" | tail -1)
          narrowed=$(sed -nE 's/^narrowed: ([0-9]+) instance.*$/\1/p' "$validation" | tail -1)
          spec_only=$(sed -nE 's/^spec-only: ([0-9]+) instance.*$/\1/p' "$validation" | tail -1)
          differing=$(sed -nE 's/^structural diff: ([0-9]+) differing path\(s\).*$/\1/p' "$structure" | tail -1)
          healthy=true
          [ -n "$disagreements" ] && [ -n "$differing" ] && [ -n "$narrowed" ] && [ -n "$spec_only" ] || healthy=false
          [ "$structure_status" -eq 0 ] || healthy=false
          case "$validation_status" in
            0) [ "${disagreements:-1}" -eq 0 ] || healthy=false ;;
            1) [ "${disagreements:-0}" -gt 0 ] || healthy=false ;;
            *) healthy=false ;;
          esac
          if [ "$healthy" != true ]; then
            echo "::error::schema-equivalence did not report cleanly (validation exit $validation_status, structural exit $structure_status); see the step log"
            exit 1
          fi
          {
            echo "version=$version"
            echo "disagreements=$disagreements"
            echo "differing=$differing"
            echo "narrowed=$narrowed"
            echo "spec_only=$spec_only"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Schema drift between the \`$version\` release and the draft"
            echo "Each side reads a \`spec\` member as its own wire string (\`agent-hooks/$version\`, \`agent-hooks/draft\`); $spec_only instance(s) differ by that member alone and are not counted below."
            if [ "$disagreements" -eq 0 ] && [ "$differing" -eq 0 ]; then
              echo "No drift: the draft schemas accept and reject the same instances as the release, and no path differs after normalization."
            else
              echo "Drift: $disagreements instance(s) judged differently, $narrowed of them accepted by the release and rejected by the draft, and $differing differing path(s). The draft is a version of its own; what it narrows is what a $version host changes when it moves to the draft (VERSIONING.md). This is a report, not a gate."
            fi
            echo '```'
            cat "$validation" "$structure"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        working-directory: sdk/typescript
      - name: Report schema drift between the latest release and the draft (advisory)
        # The draft is allowed to move away from the release, so this
        # step continues on error; its red result is the signal, and
        # the numbers come from the gated step above.
        continue-on-error: true
        env:
          VERSION: ${{ steps.drift.outputs.version }}
          DISAGREEMENTS: ${{ steps.drift.outputs.disagreements }}
          DIFFERING: ${{ steps.drift.outputs.differing }}
          NARROWED: ${{ steps.drift.outputs.narrowed }}
          SPEC_ONLY: ${{ steps.drift.outputs.spec_only }}
        run: |
          if [ "$DISAGREEMENTS" -eq 0 ] && [ "$DIFFERING" -eq 0 ]; then
            echo "no drift between the $VERSION release and the draft beyond the wire string ($SPEC_ONLY instance(s) differ by the spec member alone)"
          else
            echo "::warning::the draft schemas drift from the $VERSION release: $DISAGREEMENTS instance(s) judged differently ($NARROWED narrowed; $SPEC_ONLY more by the spec member alone, not counted), $DIFFERING differing path(s); see the job summary"
            exit 1
          fi
      - run: cargo fetch --locked
        # napi-cli does not forward --locked; fetching first pins the
        # graph, and the build below resolves offline-consistent.
        working-directory: sdk/typescript
      - run: npm run build:native:debug
        working-directory: sdk/typescript
      - name: Generated-binding drift (mirrors schema-drift)
        run: git diff --exit-code -- binding.js binding.d.ts
        working-directory: sdk/typescript
      - run: npx tsc
        working-directory: sdk/typescript
      # All test files, never an allowlist: the emitter suite shipped
      # ~100 tests before first running in CI because this line named
      # two files. test/draft/ is the advisory set, run in draft-tests.
      - run: node --test test/*.mjs
        working-directory: sdk/typescript

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with: { toolchain: stable, components: "clippy, rustfmt" }
      - run: cargo fmt --all --check
        working-directory: sdk/rust
      - run: cargo clippy --locked --workspace --all-features -- -D warnings
        working-directory: sdk/rust
      # The required set: the draft_only_* tests run in draft-tests.
      - run: cargo test --locked --workspace --all-features -- --skip draft_only
        working-directory: sdk/rust

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with: { toolchain: stable }
      - name: Build ffi cdylib
        run: cargo build --locked -p agent-hooks-ffi --release
        working-directory: sdk/rust
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { dotnet-version: "8.0.x" }
      - run: dotnet restore --locked-mode
        working-directory: sdk/dotnet
      - run: dotnet format --no-restore --verify-no-changes
        working-directory: sdk/dotnet
      - run: dotnet build --no-restore -warnaserror
        working-directory: sdk/dotnet
      - name: Test (golden identity)
        # The required set: the Category=draft tests run in draft-tests.
        run: dotnet test test/AgentHooks.Tests/ --nologo --filter "Category!=draft"
        working-directory: sdk/dotnet
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/sdk/rust/target/release

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with: { toolchain: stable }
      - name: Build ffi cdylib
        run: cargo build --locked -p agent-hooks-ffi --release
        working-directory: sdk/rust
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.22" }
      - name: Build and test
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::gofmt violations"; exit 1; }
          go build ./...
          go vet ./...
          # The required set: the TestDraftOnly* tests run in draft-tests.
          go test ./... -skip 'DraftOnly' -v
        working-directory: sdk/go
        env:
          CGO_LDFLAGS: -L${{ github.workspace }}/sdk/rust/target/release -lagent_hooks_ffi
          LD_LIBRARY_PATH: ${{ github.workspace }}/sdk/rust/target/release

  # Cross-platform build+test of the core and one FFI consumer
  # Advisory: not in the required-check set yet — required
  # names must be stable and always-reporting (see CONTRIBUTING.md).
  rust-xplat:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with: { toolchain: stable }
      - run: cargo test --locked --workspace --all-features -- --skip draft_only
        working-directory: sdk/rust

  dotnet-xplat:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      FFI_NATIVE_DIR: ${{ matrix.os == 'windows-latest' && 'sdk/rust/target/x86_64-pc-windows-msvc/release' || 'sdk/rust/target/release' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        if: runner.os != 'Windows'
        with: { toolchain: stable }
      - name: Build ffi cdylib
        if: runner.os != 'Windows'
        run: cargo build --locked -p agent-hooks-ffi --release
        working-directory: sdk/rust
      - name: Build and scan protected Windows FFI
        if: runner.os == 'Windows'
        timeout-minutes: 15
        uses: ./.github/actions/windows-ffi
      - name: Check Windows release DLL CFG and regression gate
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-cfg.ps1 -Dll ${{ env.FFI_NATIVE_DIR }}/agent_hooks_ffi.dll
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: runner.os != 'Windows'
        with: { dotnet-version: "8.0.x" }
      - run: dotnet restore --locked-mode
        working-directory: sdk/dotnet
      - name: Expose native library to the per-OS loader
        # GITHUB_PATH covers the Windows DLL search path; the *_LIBRARY_PATH
        # vars cover the ELF/Mach-O loaders. Native.cs has no custom
        # resolver, so these are the only search knobs.
        shell: bash
        run: echo "${{ github.workspace }}/${{ env.FFI_NATIVE_DIR }}" >> "$GITHUB_PATH"
      - name: Test
        run: dotnet test test/AgentHooks.Tests/ --nologo --filter "Category!=draft"
        working-directory: sdk/dotnet
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/${{ env.FFI_NATIVE_DIR }}
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/${{ env.FFI_NATIVE_DIR }}

  # Advisory, never required: the working test set for the next
  # specification version (the draft-only vectors, introduced_in: draft)
  # and the SDK tests that read draft-only files (the draft's
  # inventories, examples and schemas). Every step continues on error
  # and the last step writes the outcomes to the step summary, so a
  # draft change cannot turn a required check red. The required jobs run
  # the released set under 0.1. Binding tests to a draft revision is
  # #188.
  draft-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22" }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with: { toolchain: stable }
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { dotnet-version: "8.0.x" }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.22" }
      - name: Draft-only vectors validate against the draft schemas
        id: vectors
        continue-on-error: true
        run: |
          set -eu
          npm install -g ajv-cli@5.0.0 ajv-formats@3.0.1
          mapfile -t vectors < <(python3 scripts/vectors-for-bundle.py list draft)
          mapfile -t refs < <(find spec/draft/schema/generated -name '*.schema.json' -not -path '*/src/*' | sort | sed 's/^/-r=/')
          data=()
          for v in "${vectors[@]}"; do data+=(-d "$v"); done
          ajv validate --spec=draft2020 -c ajv-formats -s conformance/draft/vectors.schema.json "${refs[@]}" "${data[@]}"
          echo "validated ${#vectors[@]} draft vectors against spec/draft"
      - name: Rust draft-only tests
        id: rust
        continue-on-error: true
        run: cargo test --locked --workspace --all-features -- draft_only
        working-directory: sdk/rust
      - name: Build ffi cdylib
        id: ffi
        continue-on-error: true
        run: cargo build --locked -p agent-hooks-ffi --release
        working-directory: sdk/rust
      - name: Python draft-only tests
        id: python
        continue-on-error: true
        run: |
          uv pip install --system -r sdk/python/requirements-dev.lock
          uv pip install --system --no-deps --no-build-isolation -e ./sdk/python
          pytest sdk/python/tests -p no:agent_hooks_ctk -m draft -v
      - name: TypeScript draft-only tests
        id: typescript
        continue-on-error: true
        run: |
          npm ci
          cargo fetch --locked
          npm run build:native:debug
          npx tsc
          node --test test/draft/*.mjs
        working-directory: sdk/typescript
      - name: .NET draft-only tests
        id: dotnet
        continue-on-error: true
        run: |
          dotnet restore --locked-mode
          dotnet test test/AgentHooks.Tests/ --nologo --filter "Category=draft"
        working-directory: sdk/dotnet
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/sdk/rust/target/release
      - name: Go draft-only tests
        id: go
        continue-on-error: true
        run: go test ./... -run 'DraftOnly' -v
        working-directory: sdk/go
        env:
          CGO_LDFLAGS: -L${{ github.workspace }}/sdk/rust/target/release -lagent_hooks_ffi
          LD_LIBRARY_PATH: ${{ github.workspace }}/sdk/rust/target/release
      - name: Summary
        env:
          VECTORS: ${{ steps.vectors.outcome }}
          RUST: ${{ steps.rust.outcome }}
          FFI: ${{ steps.ffi.outcome }}
          PYTHON: ${{ steps.python.outcome }}
          TYPESCRIPT: ${{ steps.typescript.outcome }}
          DOTNET: ${{ steps.dotnet.outcome }}
          GO: ${{ steps.go.outcome }}
        run: |
          {
            echo "## Draft-only tests (advisory)"
            echo "The working test set for the next specification version and the SDK tests that read draft-only files. Not required; see #188."
            echo
            echo "| Step | Outcome |"
            echo "| --- | --- |"
            echo "| Draft-only vectors against the draft schemas | $VECTORS |"
            echo "| Rust draft_only_* tests | $RUST |"
            echo "| FFI build for .NET and Go | $FFI |"
            echo "| Python -m draft tests | $PYTHON |"
            echo "| TypeScript test/draft | $TYPESCRIPT |"
            echo "| .NET Category=draft tests | $DOTNET |"
            echo "| Go TestDraftOnly* tests | $GO |"
          } >> "$GITHUB_STEP_SUMMARY"
          for outcome in "$VECTORS" "$RUST" "$FFI" "$PYTHON" "$TYPESCRIPT" "$DOTNET" "$GO"; do
            if [ "$outcome" != "success" ]; then
              echo "::warning::a draft-only step did not succeed; see the job summary (advisory, not required)"
              break
            fi
          done

  # Workflow files were ungated until a duplicate mapping key invalidated
  # release.yml for every event (PR #25) — actionlint gates them now, and
  # the version surfaces are checked for agreement (VERSIONING.md).
  # Advisory: not in the required-check set yet (names must prove stable).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22" }
      - name: actionlint (pinned, checksum-verified)
        run: |
          curl -sSfL -o actionlint.tgz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz actionlint
          ./actionlint -color
      - name: Version surfaces agree across SDK manifests
        run: python3 scripts/check-version-consistency.py
      - name: Specification version folders are complete and indexed
        run: python3 scripts/check-spec-versions.py
      - name: Repository script regression tests
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v
      - run: npm ci
        working-directory: sdk/typescript
      - name: Committed JSON Schemas match their TypeScript source
        # Type-checks spec/draft/schema/src, regenerates to memory and compares
        # with the committed files (sdk/typescript/scripts/generate-schemas.mts).
        run: npm run check:schema
        working-directory: sdk/typescript
      - name: Released schema bundles match their TypeScript source
        # The same check for every spec/<MAJOR.MINOR>/ bundle: the frozen
        # source must still generate the frozen output.
        run: |
          set -eu
          version_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          checked=0
          for dir in ../../spec/*/; do
            version=$(basename "$dir")
            [[ $version =~ $version_pattern ]] || continue
            echo "Checking spec/$version/schema"
            npx tsc -p "${dir}schema/src/tsconfig.json"
            npx tsx scripts/generate-schemas.mts --check --spec "$version"
            checked=$((checked + 1))
          done
          if [ "$checked" -eq 0 ]; then
            echo "::error::no released spec/<MAJOR.MINOR>/ folder found"
            exit 1
          fi
          echo "checked $checked released bundle(s)"
        working-directory: sdk/typescript
      - name: Source files carry the standard file header
        run: python3 scripts/check-file-headers.py

  # Dependency advisories, license allowlist, bans and source checks for
  # every cargo root. deny.toml at the repository root governs
  # all three; the vendored JCS serializer's one retained dependency
  # (ryu-js) is covered like every other node.
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-deny@0.20.2
      - name: cargo deny (all three cargo roots)
        run: |
          for root in sdk/rust sdk/python sdk/typescript; do
            echo "::group::$root"
            (cd "$root" && cargo deny --locked check advisories licenses bans sources)
            echo "::endgroup::"
          done

  python-xplat:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with: { toolchain: stable }
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install and test
        # requirements-dev.lock is compiled on Linux and is not portable;
        # this advisory job installs the package (Rust side still pinned
        # via [tool.maturin] locked=true) plus the test dependencies.
        shell: bash
        run: |
          uv pip install --system ./sdk/python "pytest>=9.1.1" "jsonschema>=4.26.0"
          pytest sdk/python/tests -p no:agent_hooks_ctk -m "not draft"

  typescript-xplat:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with: { toolchain: stable }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22" }
      - name: Build native binding and test
        # Mirrors the Linux typescript job minus the drift gate: napi
        # writes the host-platform .node next to binding.js, tsc emits
        # dist/ (the tests import dist/index.js), then the full suite runs.
        shell: bash
        run: |
          npm ci
          cargo fetch --locked
          npm run build:native:debug
          npx tsc
          node --test test/*.mjs
        working-directory: sdk/typescript

  go-xplat:
    # The Windows leg builds the ffi crate for x86_64-pc-windows-gnu:
    # cgo links with the GNU toolchain, which cannot consume the
    # msvc-built cdylib (no import library for mingw gcc). The gnu
    # target emits libagent_hooks_ffi.dll.a next to the dll, so the
    # runner's mingw gcc resolves -lagent_hooks_ffi directly.
    # Advisory: not in the required-check set yet (names must prove stable).
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        # include only attaches `target` to existing os entries, so the
        # check names stay `go-xplat (<os>)`.
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install ${{ matrix.target }} for the pinned toolchain
        # rust-toolchain.toml pins the toolchain inside sdk/rust; the
        # setup action installs targets for `stable` only, so the target
        # must be added in the pinned context (as in release.yml ffi-build).
        shell: bash
        run: rustup target add ${{ matrix.target }}
        working-directory: sdk/rust
      - name: Build ffi cdylib
        shell: bash
        run: cargo build --locked -p agent-hooks-ffi --release --target ${{ matrix.target }}
        working-directory: sdk/rust
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.22" }
      - name: Expose native library to the per-OS loader
        # GITHUB_PATH covers the Windows DLL search path (mirrors
        # dotnet-xplat); DYLD_LIBRARY_PATH below covers the Mach-O loader.
        shell: bash
        run: echo "${{ github.workspace }}/sdk/rust/target/${{ matrix.target }}/release" >> "$GITHUB_PATH"
      - name: Build and test
        shell: bash
        run: |
          go build ./...
          go test ./... -skip 'DraftOnly'
        working-directory: sdk/go
        env:
          CGO_LDFLAGS: -L${{ github.workspace }}/sdk/rust/target/${{ matrix.target }}/release -lagent_hooks_ffi
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/sdk/rust/target/${{ matrix.target }}/release
