name: ci

on:
  push:
    branches: [main]
  pull_request:

# Supply chain: least privilege — jobs only read the repo.
permissions:
  contents: read

jobs:
  schema-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: "22" }
      - run: npm install -g ajv-cli@5.0.0 ajv-formats@3.0.1
      - name: Validate schemas are well-formed
        run: |
          set -e
          all="spec/schema/*.json spec/schema/agent-context/*.json conformance/vectors.schema.json"
          for f in $all; do
            # -r must not include the file under -s (ajv rejects duplicate $id)
            refs=$(ls $all | grep -vxF "$f" | sed 's/^/-r /' | tr '\n' ' ')
            ajv compile --spec=draft2020 -c ajv-formats -s "$f" $refs
          done
      - name: Validate vectors against vectors.schema.json
        run: |
          ajv validate --spec=draft2020 -c ajv-formats \
            -s conformance/vectors.schema.json \
            -r 'spec/schema/*.json' \
            -r 'spec/schema/agent-context/*.json' \
            -d 'conformance/vectors/*.json'

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: { python-version: "3.12" }
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Install locked dependencies, then the package itself
        # requirements-dev.lock pins every transitive dep including the
        # maturin build backend (uv pip compile); --no-build-isolation
        # makes the editable install use that pinned maturin instead of
        # fetching a floating one, and [tool.maturin] locked=true pins
        # the Rust side via Cargo.lock.
        run: |
          uv pip install --system -r sdk/python/requirements-dev.lock
          uv pip install --system --no-deps --no-build-isolation -e ./sdk/python
      - run: ruff check sdk/python
      - run: pytest sdk/python/tests -p no:agent_hooks_ctk -v

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: "22" }
      - run: npm ci
        working-directory: sdk/typescript
      - run: cargo fetch --locked
        # napi-cli does not forward --locked; fetching first pins the
        # graph, and the build below resolves offline-consistent.
        working-directory: sdk/typescript
      - run: npm run build:native:debug
        working-directory: sdk/typescript
      - run: npx tsc
        working-directory: sdk/typescript
      - run: node --test test/golden_identity.test.mjs test/ctk_reference.test.mjs
        working-directory: sdk/typescript

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with: { components: clippy }
      - run: cargo clippy --locked --workspace --all-features -- -D warnings
        working-directory: sdk/rust
      - run: cargo test --locked --workspace --all-features
        working-directory: sdk/rust

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Build ffi cdylib
        run: cargo build --locked -p agent-hooks-ffi --release
        working-directory: sdk/rust
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with: { dotnet-version: "8.0.x" }
      - run: dotnet restore --locked-mode
        working-directory: sdk/dotnet
      - run: dotnet build --no-restore -warnaserror
        working-directory: sdk/dotnet
      - name: Test (golden identity)
        run: dotnet test test/AgentHooks.Tests/ --nologo
        working-directory: sdk/dotnet
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/sdk/rust/target/release

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Build ffi cdylib
        run: cargo build --locked -p agent-hooks-ffi --release
        working-directory: sdk/rust
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with: { go-version: "1.22" }
      - name: Build and test
        run: |
          go build ./...
          go vet ./...
          go test ./... -v
        working-directory: sdk/go
        env:
          CGO_LDFLAGS: -L${{ github.workspace }}/sdk/rust/target/release -lagent_hooks_ffi
          LD_LIBRARY_PATH: ${{ github.workspace }}/sdk/rust/target/release
