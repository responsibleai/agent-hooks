# Tag-driven release pipeline.
#
# Trigger: push a tag `v*` (e.g. v0.1.0-alpha.2) — one tag releases the
# spec + all five SDKs together (VERSIONING.md). Or run manually with
# dry_run=true to build everything and skip every upload.
#
# Publishing setup (one-time, per registry):
#   PyPI   — trusted publishing (OIDC): add this repo/workflow as a
#            publisher for project `agent-hooks-sdk` at
#            https://pypi.org/manage/project/agent-hooks-sdk/settings/publishing/
#            (no token; the `id-token: write` permission below is the
#            credential).
#   crates — trusted publishing (OIDC): configure the publisher on the
#            crate (repo responsibleai/agent-hooks, workflow release.yml,
#            environment release) at
#            https://crates.io/crates/agent-hooks-sdk/settings ->
#            Trusted Publishing. No token.
#   npm    — trusted publishing (OIDC): configure a trusted publisher
#            on the package (repo responsibleai/agent-hooks, workflow
#            release.yml, environment release) at
#            npmjs.com > package > Settings > Trusted Publisher.
#            No token. First-ever publish of a new package cannot use
#            trusted publishing — bootstrap once with a granular token
#            (npm publish from a maintainer machine or a temporary
#            NPM_TOKEN secret), then configure the publisher.
#   NuGet  — trusted publishing (OIDC): configure a Trusted Publishing
#            policy on nuget.org (repo responsibleai/agent-hooks,
#            workflow release.yml, environment release); the NuGet/login
#            action exchanges the workflow OIDC token for a short-lived
#            key. Set the non-sensitive NUGET_USER secret to the
#            nuget.org username that owns the policy.
#   Go     — no registry: the module proxy serves the git tag directly.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and attest everything, skip all uploads
        type: boolean
        default: true
      bootstrap_platform_packages:
        description: >-
          One-time bootstrap: publish the npm platform packages from a
          dispatch run (they cannot use trusted publishing before their
          first publish). Requires the NPM_TOKEN environment secret and
          dry_run=false. Only the platform-package step is enabled;
          every other publish remains tag-gated.
        type: boolean
        default: false

permissions:
  contents: read

env:
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  python:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing + provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned via sdk/rust/rust-toolchain.toml
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Build wheel + sdist
        run: |
          uv tool install maturin==1.11.5
          maturin build --release --locked -m sdk/python/Cargo.toml -o dist
          maturin sdist -m sdk/python/Cargo.toml -o dist
      - name: SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: sdk/python
          artifact-name: sbom-python.spdx.json
      - name: Attest build provenance
        if: env.DRY_RUN != 'true' && github.ref_type == 'tag'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v2
        with:
          subject-path: dist/*
      - name: Publish to PyPI (trusted publishing)
        if: env.DRY_RUN != 'true' && github.ref_type == 'tag'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1
        with:
          packages-dir: dist
          skip-existing: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: python-dist, path: dist/* }

  rust:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned via sdk/rust/rust-toolchain.toml
      - name: Package (verifies the publishable crate)
        run: cargo package --locked -p agent-hooks-sdk
        working-directory: sdk/rust
      - name: SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: sdk/rust
          artifact-name: sbom-rust.spdx.json
      - name: Attest build provenance
        if: env.DRY_RUN != 'true' && github.ref_type == 'tag'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v2
        with:
          subject-path: sdk/rust/target/package/*.crate
      - name: Authenticate to crates.io (trusted publishing)
        if: env.DRY_RUN != 'true' && github.ref_type == 'tag'
        id: cratesio-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
      - name: Publish to crates.io
        if: env.DRY_RUN != 'true' && github.ref_type == 'tag'
        # Idempotent: skip when this version already exists (sparse index).
        run: |
          V=$(cargo pkgid -p agent-hooks-sdk | sed 's/.*[#@]//')
          if curl -sf https://index.crates.io/ag/en/agent-hooks-sdk | grep -q "\"vers\":\"$V\""; then
            echo "agent-hooks-sdk $V already on crates.io — skipping"
          else
            cargo publish --locked -p agent-hooks-sdk
          fi
        working-directory: sdk/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.cratesio-auth.outputs.token }}

  typescript-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu }
          - { os: macos-latest,   target: aarch64-apple-darwin }
          - { os: macos-latest,   target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned via sdk/rust/rust-toolchain.toml
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22" }
      - name: Build native binding for ${{ matrix.target }}
        shell: bash
        run: |
          npm ci
          cargo fetch --locked
          npx napi build --release --platform --target ${{ matrix.target }} \
            --js binding.js --dts binding.d.ts
        working-directory: sdk/typescript
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binding-${{ matrix.target }}
          path: sdk/typescript/*.node
          if-no-files-found: error

  typescript:
    needs: typescript-build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # npm --provenance + attestation
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22", registry-url: "https://registry.npmjs.org" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: sdk/typescript/artifacts
      - name: Distribute binaries into platform packages
        # napi artifacts copies each downloaded *.node into the matching
        # committed npm/<platform>/ package dir (napi create-npm-dirs).
        run: |
          npm ci
          npx napi artifacts -d artifacts
          npx tsc
          npm pack
        working-directory: sdk/typescript
      - name: SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: sdk/typescript
          artifact-name: sbom-typescript.spdx.json
      - name: Attest build provenance
        if: env.DRY_RUN != 'true' && github.ref_type == 'tag'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v2
        with:
          subject-path: |
            sdk/typescript/*.tgz
            sdk/typescript/npm/**/*.node
      - name: Publish to npm (platform packages, then the loader package)
        if: env.DRY_RUN != 'true' && (github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.bootstrap_platform_packages))
        # OIDC trusted publishing: no token. Each PACKAGE (the four
        # platform packages and the main one) needs its own trusted
        # publisher on npmjs.com (repo responsibleai/agent-hooks,
        # workflow release.yml, environment release). A package's FIRST
        # publish cannot use trusted publishing — bootstrap once with a
        # granular token exposed as NPM_TOKEN, then configure the
        # publisher and drop the secret. npm provenance requires a
        # PUBLIC source repo; while this repo is private the provenance
        # leg fails — see the bootstrap note above.
        # Prerelease versions publish under the `alpha` dist-tag;
        # stable under latest. Idempotent: existing versions skip.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install -g npm@latest
          V=$(node -p "require('./package.json').version")
          case "$V" in *-*) T=alpha;; *) T=latest;; esac
          # Platform-package versions and the loader's optionalDependencies
          # pins must both equal the main version (npx napi version syncs
          # the dirs; the pins are updated in the same commit as a bump).
          npx napi version
          # shellcheck disable=SC2016 # ${n}@${v} are JS template literals, not shell
          node -e '
            const p = require("./package.json");
            for (const [n, v] of Object.entries(p.optionalDependencies))
              if (v !== p.version) { console.error(`optionalDependencies pin ${n}@${v} != ${p.version}`); process.exit(1); }
          '
          for dir in npm/linux-x64-gnu npm/darwin-x64 npm/darwin-arm64 npm/win32-x64-msvc .; do
            name=$(node -p "require('./$dir/package.json').name")
            if [ "$dir" != "." ] && ! ls "$dir"/*.node >/dev/null 2>&1; then
              echo "::error::$name has no native artifact"; exit 1
            fi
            if npm view "$name@$V" version >/dev/null 2>&1; then
              echo "$name@$V already on npm — skipping"
            else
              (cd "$dir" && npm publish --access public --tag "$T")
            fi
          done
        working-directory: sdk/typescript

  dotnet:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned via sdk/rust/rust-toolchain.toml
      - run: cargo build --locked -p agent-hooks-ffi --release
        working-directory: sdk/rust
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { dotnet-version: "8.0.x" }
      - run: dotnet restore --locked-mode && dotnet pack src/AgentHooks -c Release -o dist
        working-directory: sdk/dotnet
      - name: SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: sdk/dotnet
          artifact-name: sbom-dotnet.spdx.json
      - name: Attest build provenance
        if: env.DRY_RUN != 'true' && github.ref_type == 'tag'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v2
        with:
          subject-path: sdk/dotnet/dist/*.nupkg
      - name: Authenticate to NuGet (trusted publishing)
        if: env.DRY_RUN != 'true' && github.ref_type == 'tag'
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish to NuGet
        if: env.DRY_RUN != 'true' && github.ref_type == 'tag'
        run: dotnet nuget push dist/*.nupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
        working-directory: sdk/dotnet

  # Go has no upload: the module proxy serves the tag. This job proves
  # the tagged tree builds as a module consumer would see it.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned via sdk/rust/rust-toolchain.toml
      - run: cargo build --locked -p agent-hooks-ffi --release
        working-directory: sdk/rust
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.22" }
      - run: go build ./... && go test ./...
        working-directory: sdk/go
        env:
          CGO_LDFLAGS: -L${{ github.workspace }}/sdk/rust/target/release -lagent_hooks_ffi
          LD_LIBRARY_PATH: ${{ github.workspace }}/sdk/rust/target/release
