# Tag-driven release pipeline.
#
# Trigger: push a tag `v*` (e.g. v0.1.0-alpha.2) — one tag releases the
# spec + all five SDKs together (VERSIONING.md). Or run manually:
# dry_run=true builds everything and skips attestation and every
# upload; dry_run=false performs a real publish from the selected ref
# (gated by the release environment). Every registry leg skips files
# and versions that already exist, so a non-dry dispatch is idempotent
# and can append artifacts to an already-published version (e.g. new
# platform wheels).
#
# Publishing setup (one-time, per registry):
#   PyPI   — trusted publishing (OIDC): add this repo/workflow as a
#            publisher for project `agent-hooks-sdk` at
#            https://pypi.org/manage/project/agent-hooks-sdk/settings/publishing/
#            (no token; the `id-token: write` permission below is the
#            credential).
#   crates — trusted publishing (OIDC): configure the publisher on the
#            crate (repo responsibleai/agent-hooks, workflow release.yml,
#            environment release) at
#            https://crates.io/crates/agent-hooks-sdk/settings ->
#            Trusted Publishing. No token.
#   npm    — trusted publishing (OIDC): configure a trusted publisher
#            on the package (repo responsibleai/agent-hooks, workflow
#            release.yml, environment release) at
#            npmjs.com > package > Settings > Trusted Publisher.
#            No token; every package (the loader + each platform
#            package) needs its own trusted publisher. A brand-new
#            platform package cannot be configured before its first
#            publish, so its leg fails soft (see the npm publish step).
#   NuGet  — trusted publishing (OIDC): configure a Trusted Publishing
#            policy on nuget.org (repo responsibleai/agent-hooks,
#            workflow release.yml, environment release); the NuGet/login
#            action exchanges the workflow OIDC token for a short-lived
#            key. Set the non-sensitive NUGET_USER secret to the
#            nuget.org username that owns the policy.
#   Go     — no registry: the module proxy serves the git tag directly.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build everything, skip attestation and all uploads
        type: boolean
        default: true

permissions:
  contents: read

env:
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  python-wheels:
    name: Python wheel (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, platform: linux-x86_64 }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, platform: linux-aarch64 }
          - { os: macos-latest, target: x86_64-apple-darwin, platform: macos-x86_64 }
          - { os: macos-latest, target: aarch64-apple-darwin, platform: macos-aarch64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, platform: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU for Linux ARM64
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64
      - name: Build Linux wheel
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --locked --compatibility pypi -m sdk/python/Cargo.toml -o dist
          manylinux: "2_28"
          maturin-version: v1.14.1
          rust-toolchain: "1.95.0"
      - name: Build macOS or Windows wheel
        if: runner.os != 'Linux'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --locked --compatibility pypi -m sdk/python/Cargo.toml -o dist
          maturin-version: v1.14.1
          rust-toolchain: "1.95.0"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-wheel-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error

  python-sdist:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build source distribution
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: -m sdk/python/Cargo.toml -o dist
          maturin-version: v1.14.1
          rust-toolchain: "1.95.0"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  python:
    needs: [python-wheels, python-sdist]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing + provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - name: Verify complete Python distribution
        shell: bash
        run: |
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 5
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1
          patterns=(
            'dist/*manylinux*_x86_64.whl'
            'dist/*manylinux*_aarch64.whl'
            'dist/*macosx*_x86_64.whl'
            'dist/*macosx*_arm64.whl'
            'dist/*win_amd64.whl'
          )
          for pattern in "${patterns[@]}"; do
            compgen -G "$pattern" >/dev/null || { echo "::error::missing artifact matching $pattern"; exit 1; }
          done
      - name: SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: sdk/python
          artifact-name: sbom-python.spdx.json
      - name: Attest build provenance
        if: env.DRY_RUN != 'true'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v2
        with:
          subject-path: dist/*
      - name: Publish to PyPI (trusted publishing)
        if: env.DRY_RUN != 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1
        with:
          packages-dir: dist
          skip-existing: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: python-dist, path: dist/* }

  rust:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master; toolchain pinned via sdk/rust/rust-toolchain.toml
        with: { toolchain: stable }
      - name: Package (verifies the publishable crate)
        run: cargo package --locked -p agent-hooks-sdk
        working-directory: sdk/rust
      - name: SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: sdk/rust
          artifact-name: sbom-rust.spdx.json
      - name: Attest build provenance
        if: env.DRY_RUN != 'true'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v2
        with:
          subject-path: sdk/rust/target/package/*.crate
      - name: Authenticate to crates.io (trusted publishing)
        if: env.DRY_RUN != 'true'
        id: cratesio-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
      - name: Publish to crates.io
        if: env.DRY_RUN != 'true'
        # Idempotent: skip when this version already exists (sparse index).
        run: |
          V=$(cargo pkgid -p agent-hooks-sdk | sed 's/.*[#@]//')
          if curl -sf https://index.crates.io/ag/en/agent-hooks-sdk | grep -q "\"vers\":\"$V\""; then
            echo "agent-hooks-sdk $V already on crates.io — skipping"
          else
            cargo publish --locked -p agent-hooks-sdk
          fi
        working-directory: sdk/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.cratesio-auth.outputs.token }}

  typescript-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,      target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm,   target: aarch64-unknown-linux-gnu }
          - { os: macos-latest,       target: aarch64-apple-darwin }
          - { os: macos-latest,       target: x86_64-apple-darwin }
          - { os: windows-latest,     target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master; toolchain pinned via sdk/rust/rust-toolchain.toml
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22" }
      - name: Build native binding for ${{ matrix.target }}
        shell: bash
        run: |
          npm ci
          cargo fetch --locked
          npx napi build --release --platform --target ${{ matrix.target }} \
            --js binding.js --dts binding.d.ts
        working-directory: sdk/typescript
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binding-${{ matrix.target }}
          path: sdk/typescript/*.node
          if-no-files-found: error

  typescript:
    needs: typescript-build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # npm --provenance + attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22", registry-url: "https://registry.npmjs.org" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: sdk/typescript/artifacts
      - name: Distribute binaries into platform packages
        # napi artifacts copies each downloaded *.node into the matching
        # committed npm/<platform>/ package dir (napi create-npm-dirs).
        run: |
          npm ci
          npx napi artifacts -d artifacts
          npx tsc
          npm pack
        working-directory: sdk/typescript
      - name: SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: sdk/typescript
          artifact-name: sbom-typescript.spdx.json
      - name: Attest build provenance
        if: env.DRY_RUN != 'true'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v2
        with:
          subject-path: |
            sdk/typescript/*.tgz
            sdk/typescript/npm/**/*.node
      - name: Publish to npm (platform packages, then the loader package)
        if: env.DRY_RUN != 'true'
        # OIDC trusted publishing: no token. Each package (the
        # platform packages and the loader) has its own trusted
        # publisher on npmjs.com (repo responsibleai/agent-hooks,
        # workflow release.yml, environment release). The repo is
        # public, so npm attaches provenance automatically under
        # trusted publishing. Prerelease versions publish under the
        # `alpha` dist-tag; stable under latest. Idempotent: existing
        # versions skip.
        run: |
          npm install -g npm@latest
          V=$(node -p "require('./package.json').version")
          case "$V" in *-*) T=alpha;; *) T=latest;; esac
          # The committed loader manifest carries NO optionalDependencies:
          # pinning platform packages that only exist after this run makes
          # main unbuildable between a version-bump merge and its publish.
          # npx napi version syncs the platform dirs; the block is injected
          # here from the loader version, so it cannot mismatch.
          npx napi version
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const targets = ["linux-x64-gnu","linux-arm64-gnu","darwin-x64","darwin-arm64","win32-x64-msvc"];
            p.optionalDependencies = Object.fromEntries(
              targets.map(t => ["@responsibleai/agent-hooks-" + t, p.version]));
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
          '
          for dir in npm/linux-x64-gnu npm/linux-arm64-gnu npm/darwin-x64 npm/darwin-arm64 npm/win32-x64-msvc .; do
            name=$(node -p "require('./$dir/package.json').name")
            if [ "$dir" != "." ] && ! ls "$dir"/*.node >/dev/null 2>&1; then
              echo "::error::$name has no native artifact"; exit 1
            fi
            if npm view "$name@$V" version >/dev/null 2>&1; then
              echo "$name@$V already on npm — skipping"
            elif (cd "$dir" && npm publish --access public --tag "$T"); then
              :
            elif ! npm view "$name" name >/dev/null 2>&1; then
              # npm trusted publishing cannot be configured for a package
              # that has never been published, so a brand-new platform
              # package fails its first OIDC publish. Fail soft: consumers
              # tolerate a missing optionalDependency; bootstrap the
              # package manually, then rerun this workflow (idempotent).
              echo "::warning::$name@$V first publish failed — bootstrap the new package on npmjs.com (one-time token publish), configure its trusted publisher, then rerun"
            else
              exit 1
            fi
          done
        working-directory: sdk/typescript

  ffi-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu, rid: linux-x64, lib: libagent_hooks_ffi.so }
          - { os: macos-latest,   target: aarch64-apple-darwin,     rid: osx-arm64, lib: libagent_hooks_ffi.dylib }
          - { os: macos-latest,   target: x86_64-apple-darwin,      rid: osx-x64,   lib: libagent_hooks_ffi.dylib }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   rid: win-x64,   lib: agent_hooks_ffi.dll }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master; toolchain pinned via sdk/rust/rust-toolchain.toml
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install ${{ matrix.target }} for the pinned toolchain
        # rust-toolchain.toml pins the toolchain inside sdk/rust; the
        # setup action installs targets for `stable` only, so cross
        # targets must be added in the pinned context.
        shell: bash
        run: rustup target add ${{ matrix.target }}
        working-directory: sdk/rust
      - name: Build FFI cdylib for ${{ matrix.target }}
        shell: bash
        run: cargo build --locked --release -p agent-hooks-ffi --target ${{ matrix.target }}
        working-directory: sdk/rust
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffi-${{ matrix.rid }}
          path: sdk/rust/target/${{ matrix.target }}/release/${{ matrix.lib }}
          if-no-files-found: error

  dotnet:
    needs: ffi-build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ffi-*
          path: sdk/dotnet/ffi-artifacts
      - name: Stage native runtimes into the pack layout
        shell: bash
        run: |
          for rid in linux-x64 osx-x64 osx-arm64 win-x64; do
            mkdir -p "src/AgentHooks/runtimes/$rid/native"
            cp ffi-artifacts/ffi-"$rid"/* "src/AgentHooks/runtimes/$rid/native/"
          done
          find src/AgentHooks/runtimes -type f | sort
          test "$(find src/AgentHooks/runtimes -type f | wc -l)" -eq 4
        working-directory: sdk/dotnet
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { dotnet-version: "8.0.x" }
      - run: dotnet restore --locked-mode && dotnet pack src/AgentHooks -c Release -o dist
        working-directory: sdk/dotnet
      - name: Assert the nupkg bundles all four native runtimes
        shell: bash
        run: |
          pkg=$(ls dist/*.nupkg)
          for rid in linux-x64 osx-x64 osx-arm64 win-x64; do
            unzip -l "$pkg" | grep -q "runtimes/$rid/native/" || { echo "::error::$rid native library missing from $pkg"; exit 1; }
          done
        working-directory: sdk/dotnet
      - name: SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: sdk/dotnet
          artifact-name: sbom-dotnet.spdx.json
      - name: Attest build provenance
        if: env.DRY_RUN != 'true'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v2
        with:
          subject-path: sdk/dotnet/dist/*.nupkg
      - name: Authenticate to NuGet (trusted publishing)
        if: env.DRY_RUN != 'true'
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish to NuGet
        if: env.DRY_RUN != 'true'
        run: dotnet nuget push dist/*.nupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
        working-directory: sdk/dotnet

  # Go has no upload: the module proxy serves the tag. This job proves
  # the tagged tree builds as a module consumer would see it.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master; toolchain pinned via sdk/rust/rust-toolchain.toml
        with: { toolchain: stable }
      - run: cargo build --locked -p agent-hooks-ffi --release
        working-directory: sdk/rust
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.22" }
      - run: go build ./... && go test ./...
        working-directory: sdk/go
        env:
          CGO_LDFLAGS: -L${{ github.workspace }}/sdk/rust/target/release -lagent_hooks_ffi
          LD_LIBRARY_PATH: ${{ github.workspace }}/sdk/rust/target/release
