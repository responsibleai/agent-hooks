# Documentation site (docs-site/, Astro Starlight).
#
# Builds on every PR so site breakage is caught pre-merge; deploys on
# push to main only when GitHub Pages is enabled for the repository
# (Settings -> Pages -> Source: GitHub Actions), so the job stays green
# while Pages is disabled. The site build stages each specification
# bundle, the latest alias, and each schema at the path its $id names. Nothing
# is committed, and a new version folder needs no edit here.
name: pages

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Build site
        run: pnpm --filter @agent-hooks/docs build
      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site/dist

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check whether Pages is enabled
        id: enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --silent 2>/dev/null; then
            echo "pages=true" >> "$GITHUB_OUTPUT"
          else
            echo "pages=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is not enabled; skipping deploy."
          fi
      - name: Deploy to GitHub Pages
        if: steps.enabled.outputs.pages == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
