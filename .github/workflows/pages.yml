# Documentation site (docs-site/, mkdocs-material).
#
# Builds on every PR so site breakage is caught pre-merge; deploys on
# push to main only when GitHub Pages is enabled for the repository
# (Settings -> Pages -> Source: GitHub Actions), so the job stays green
# while Pages is disabled. scripts/stage-docs-site.py copies every
# spec/<version>/ folder and spec/draft/ into the site at build time:
# one page per version, spec.md as the latest alias, each version's
# schemas at the path its $id names, and the navigation entries. Nothing
# is committed, and a new version folder needs no edit here.
name: pages

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Build site (strict)
        # Released schemas are published at the paths their $id values
        # name, so every $id dereferences; draft schemas are not published.
        run: |
          set -euo pipefail
          uv venv .mkdocs-venv
          uv pip install --python .mkdocs-venv/bin/python "mkdocs-material==9.6.23"
          python3 scripts/stage-docs-site.py
          .mkdocs-venv/bin/mkdocs build --strict -f docs-site/mkdocs.staged.yml -d "$PWD/site"
      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check whether Pages is enabled
        id: enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --silent 2>/dev/null; then
            echo "pages=true" >> "$GITHUB_OUTPUT"
          else
            echo "pages=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is not enabled; skipping deploy."
          fi
      - name: Deploy to GitHub Pages
        if: steps.enabled.outputs.pages == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
