# Documentation site (docs-site/, mkdocs-material).
#
# Builds on every PR so site breakage is caught pre-merge; deploys on
# push to main only when GitHub Pages is enabled for the repository
# (Settings -> Pages -> Source: GitHub Actions), so the job stays green
# while Pages is disabled. The released and draft spec pages are copied
# from spec/<version>/ and spec/draft/ at build time; they are not
# committed. Update SPEC_VERSION and SCHEMA_PATH when publishing a release.
name: pages

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Build site (strict)
        env:
          SPEC_VERSION: 0.1.0
          SPEC_FILE: AGENT-HOOKS-0.1.md
          SCHEMA_PATH: v0.1
        run: |
          uv venv .mkdocs-venv
          uv pip install --python .mkdocs-venv/bin/python "mkdocs-material==9.6.23"
          spec_dir="spec/${SPEC_VERSION}"
          schema_dir="docs-site/docs/schema/${SCHEMA_PATH}"
          cp "${spec_dir}/${SPEC_FILE}" docs-site/docs/spec.md
          sed -E 's#\]\(\.\./[0-9]+\.[0-9]+\.[0-9]+/AGENT-HOOKS-[0-9]+\.[0-9]+\.md\)#](spec.md)#g' "spec/draft/${SPEC_FILE}" > docs-site/docs/spec-draft.md
          # Publish released schemas so every $id dereferences; draft schemas are not published.
          mkdir -p "${schema_dir}/agent-context" "${schema_dir}/conformance"
          # Keep the published agent-context/ URLs even though the source
          # checkout calls these generated files strict-contexts/.
          cp "${spec_dir}"/schema/generated/*.schema.json "${schema_dir}/"
          cp "${spec_dir}"/schema/generated/strict-contexts/*.schema.json "${schema_dir}/agent-context/"
          cp "${spec_dir}/reserved-reasons.json" "${schema_dir}/"
          cp "${spec_dir}/declaration-errors.json" "${schema_dir}/"
          cp conformance/vectors.schema.json "${schema_dir}/conformance/"
          .mkdocs-venv/bin/mkdocs build --strict -f docs-site/mkdocs.yml -d "$PWD/site"
      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check whether Pages is enabled
        id: enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --silent 2>/dev/null; then
            echo "pages=true" >> "$GITHUB_OUTPUT"
          else
            echo "pages=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is not enabled; skipping deploy."
          fi
      - name: Deploy to GitHub Pages
        if: steps.enabled.outputs.pages == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
